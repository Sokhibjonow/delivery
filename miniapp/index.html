<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Pizza Cubick</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Telegram initData'ni ENG BIRINCHI bo'lib ushlab qolamiz.
      // Sahifa keyinroq qayta yuklansa manzildagi #tgWebAppData yo'qoladi —
      // shuning uchun uni darhol saqlab qo'yish muhim.
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          var data = (tg && tg.initData) || "";

          if (!data) {
            var hash = (location.hash || "").replace(/^#/, "");
            data = new URLSearchParams(hash).get("tgWebAppData") || "";
          }

          if (!data) {
            data =
              new URLSearchParams(location.search).get("tgWebAppData") || "";
          }

          if (data) {
            localStorage.setItem("pizza_tg_init_data", data);
          }
        } catch (e) {
          /* jim */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
